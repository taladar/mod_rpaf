<VirtualHost *:80>
  ServerName test.example
  DocumentRoot /var/www/html
  SetEnv VHOST_ID test

  ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
  <Directory /usr/lib/cgi-bin>
    Options +ExecCGI
    SetHandler cgi-script
    Require all granted
  </Directory>

  # reproduces saltweb::config::vhost_location_header_auth
  <Location />
    SetEnvIf X-Forwarded-User ^(.*)$ REMOTE_USER=$1
  </Location>

  RewriteEngine on
  RewriteRule ^/rewritten/(.*)$ /cgi-bin/env.sh [PT,L]
</VirtualHost>

