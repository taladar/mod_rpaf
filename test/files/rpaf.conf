<IfModule rpaf_module>
    RPAF_Enable On
    RPAF_SetHostName On
    RPAF_SetPort On
    RPAF_SetHTTPS On
    RPAF_EnableRequestId On

    # trusted by default: requests originating inside the container (127.0.0.1)
    # are treated as coming from a trusted reverse proxy.
    <IfDefine !UNTRUSTED>
        RPAF_ProxyIPs 127.0.0.1 ::1
    </IfDefine>
    # with -D UNTRUSTED the loopback peer is NOT in the list, so the same
    # in-container curl exercises the untrusted branch. This keeps the harness
    # independent of podman's rootless network topology.
    <IfDefine UNTRUSTED>
        RPAF_ProxyIPs 192.0.2.1
    </IfDefine>

    <IfDefine CLEANHEADERS>
        RPAF_CleanHeaders On
    </IfDefine>

    <IfDefine FORBID>
        RPAF_ForbidIfNotProxy On
    </IfDefine>

    # only parsed when requested, so the very same config file works against the
    # unmodified baseline module (unknown directives inside a false IfDefine are
    # never parsed).
    <IfDefine FORWARDED>
        RPAF_EnableForwarded On
        # the same list saltweb::config::sanitize_request_headers generates
        RPAF_SanitizeHeaders Forwarded X-Forwarded-Host X-Forwarded-Server X-Forwarded-Ssl X-Real-IP X-Forwarded-User X-Forwarded-Email X-Forwarded-Preferred-Username X-Forwarded-Groups
    </IfDefine>
</IfModule>
