# A TLS terminating vhost, so the proto parameter of the Forwarded header can be
# checked on a server that really does speak https rather than only learning the
# scheme from an upstream proxy.
#
# Everything is behind IfDefine because most of our Apache servers sit behind
# nginx or varnish on plain http and therefore do not load mod_ssl at all. That
# is the more common case and it stays the default here; -D SSLVHOST adds the
# less common one. Keeping mod_ssl out of the default configuration also means
# adding this file does not disturb the transcripts of the other cases.
<IfDefine SSLVHOST>
    LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so
    LoadModule socache_shmcb_module /usr/lib/apache2/modules/mod_socache_shmcb.so

    # ports.conf only adds Listen 443 inside <IfModule ssl_module>, and it is
    # included before this file, so the module is not loaded yet at that point
    # and we have to add the listener ourselves. Doing it the other way round
    # (enabling mod_ssl in mods-enabled) makes both fire and apache refuses to
    # start with "Cannot define multiple Listeners on the same IP:port".
    Listen 443

    <VirtualHost *:443>
        ServerName test.example
        SetEnv VHOST_ID ssl

        SSLEngine on
        SSLCertificateFile /etc/ssl/test/test.crt
        SSLCertificateKeyFile /etc/ssl/test/test.key

        ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
        <Directory /usr/lib/cgi-bin>
            Options +ExecCGI
            SetHandler cgi-script
            Require all granted
        </Directory>

        <Location />
            SetEnvIf X-Forwarded-User ^(.*)$ REMOTE_USER=$1
        </Location>
    </VirtualHost>
</IfDefine>
