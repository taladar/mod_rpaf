# One prefork child only. mod_rpaf sets r->server->server_scheme globally (see
# the comments at the top of mod_rpaf.c), so a request that leaves the scheme at
# https influences the next request served by the SAME child. With several
# children that makes the transcript nondeterministic; pinning it to one child
# makes the pre-existing leak deterministic and therefore diffable.
<IfModule mpm_prefork_module>
    StartServers            1
    MinSpareServers         1
    MaxSpareServers         1
    MaxRequestWorkers       1
    MaxConnectionsPerChild  0
</IfModule>
